name: Build website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-build
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate required files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          test -f .nojekyll
          grep -q '<html' index.html
      - name: Package website artifact
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-link-generator-site
          path: |
            index.html
            style.css
            script.js
            .nojekyll
          if-no-files-found: error
